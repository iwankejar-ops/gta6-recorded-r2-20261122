<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRAND CITY 6 — Solmar</title>
  <link rel="icon" href="data:,">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1226;
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif; color: #fff; }
  #app, #app canvas { width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .hud-top { position: absolute; top: 14px; left: 16px; display: flex; gap: 10px; align-items: center; }
  .hud-cash, .hud-rep, .hud-clock, .hud-weather {
    background: rgba(8, 14, 26, 0.72); border: 1px solid rgba(255,255,255,0.22);
    border-radius: 8px; padding: 7px 12px; font-weight: 700; font-size: 15px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
  .hud-cash { color: #7dff8a; }
  .hud-rep { color: #ffd94d; }
  .hud-clock { color: #cfe6ff; }
  .hud-weather { color: #fff; }
  .hud-stars { position: absolute; top: 12px; right: 18px; font-size: 30px; letter-spacing: 4px;
    color: #ffd94d; text-shadow: 0 0 12px rgba(255, 60, 40, 0.9), 0 2px 3px rgba(0,0,0,0.7); display: none; }
  .hud-banner { position: absolute; top: 84px; left: 50%; transform: translateX(-50%) translateY(-8px);
    text-align: center; opacity: 0; transition: opacity 0.35s, transform 0.35s; pointer-events: none; }
  .hud-banner.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .hud-banner-title { font-size: 34px; font-weight: 900; letter-spacing: 2px; color: #ffd94d;
    text-shadow: 0 2px 0 #7a3a00, 0 4px 14px rgba(0,0,0,0.8); }
  .hud-banner-sub { font-size: 15px; color: #fff; background: rgba(8,14,26,0.72);
    display: inline-block; padding: 6px 14px; border-radius: 8px; margin-top: 6px; }
  .hud-objective { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: rgba(8, 14, 26, 0.78); border: 1px solid rgba(255,217,77,0.5); border-radius: 8px;
    padding: 9px 18px; font-size: 15px; font-weight: 600; max-width: 62vw; text-align: center; }
  .hud-speed { position: absolute; bottom: 62px; right: 240px; font-size: 26px; font-weight: 800;
    color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,0.8); display: none; }
  .hud-radio { position: absolute; bottom: 18px; left: 16px; background: rgba(8,14,26,0.72);
    border: 1px solid rgba(255,255,255,0.22); border-radius: 8px; padding: 7px 12px;
    font-size: 14px; font-weight: 700; color: #8ad8ff; display: none; }
  .hud-hint { position: absolute; bottom: 62px; left: 50%; transform: translateX(-50%);
    font-size: 13px; color: rgba(255,255,255,0.85); background: rgba(8,14,26,0.55);
    padding: 5px 12px; border-radius: 6px; transition: opacity 1s; white-space: nowrap; }
  .hud-arrow { position: absolute; font-size: 15px; font-weight: 800; color: #ffd94d;
    text-shadow: 0 0 8px rgba(0,0,0,0.9); display: none; white-space: nowrap; }
  .hud-map-wrap { position: absolute; right: 16px; bottom: 16px; }
  .hud-map-label { position: absolute; top: -20px; right: 0; font-size: 12px; font-weight: 800;
    letter-spacing: 2px; color: #ffd94d; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
  .hud-map { border: 2px solid rgba(255,255,255,0.35); border-radius: 10px;
    background: #22331f; box-shadow: 0 4px 18px rgba(0,0,0,0.5); }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(10,18,38,0.82), rgba(4,7,16,0.94));
    pointer-events: auto; z-index: 20; }
  .title-inner { text-align: center; max-width: 720px; padding: 24px; }
  .title-kicker { letter-spacing: 6px; font-size: 13px; color: #8ad8ff; font-weight: 700; }
  .title-inner h1 { font-size: 84px; line-height: 0.95; font-weight: 900; letter-spacing: 2px;
    color: #fff; text-shadow: 0 4px 0 #b3541e, 0 10px 30px rgba(0,0,0,0.8); margin: 10px 0 14px; }
  .title-inner h1 span { color: #ffd94d; }
  .title-story { font-size: 16px; line-height: 1.55; color: #d8e2f0; margin-bottom: 18px; }
  .title-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 22px; text-align: left;
    font-size: 14px; color: #b8c4d8; margin: 0 auto 20px; max-width: 520px; }
  .title-controls b { color: #ffd94d; }
  .btn-big { pointer-events: auto; cursor: pointer; background: linear-gradient(180deg, #ffb52e, #e8890c);
    color: #241300; border: none; border-radius: 10px; padding: 15px 42px; font-size: 20px;
    font-weight: 900; letter-spacing: 1px; box-shadow: 0 5px 0 #8a4d00, 0 8px 22px rgba(0,0,0,0.6); }
  .btn-big:hover { filter: brightness(1.08); }
  .btn-ghost { background: rgba(255,255,255,0.12); color: #fff; box-shadow: none;
    border: 1px solid rgba(255,255,255,0.4); font-size: 16px; padding: 12px 30px; margin-top: 12px; }
  .title-foot { margin-top: 18px; font-size: 12px; color: rgba(255,255,255,0.5); }
  .panel { background: rgba(10, 16, 30, 0.96); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 14px; padding: 26px 30px; width: 560px; max-width: 92vw; max-height: 88vh;
    overflow-y: auto; text-align: center; }
  .panel h2 { font-size: 30px; letter-spacing: 3px; margin-bottom: 10px; }
  .panel h3 { font-size: 14px; letter-spacing: 2px; color: #ffd94d; margin: 18px 0 8px; text-align: left; }
  .pause-stats { font-size: 14px; color: #cfe6ff; margin-bottom: 6px; }
  .btn { pointer-events: auto; cursor: pointer; background: #1f6fd2; color: #fff; border: none;
    border-radius: 8px; padding: 11px 22px; font-size: 15px; font-weight: 700; margin: 4px 2px; }
  .btn:hover { filter: brightness(1.15); }
  .btn:disabled { opacity: 0.45; cursor: default; filter: none; }
  .btn-small { padding: 8px 13px; font-size: 13px; }
  .mission-btn { display: block; width: 100%; text-align: left; }
  .row { display: flex; justify-content: center; flex-wrap: wrap; }
  .pause-msg { margin-top: 12px; font-size: 13px; color: #8ad8ff; min-height: 18px; }
  .overlay-end .panel h2 { color: #ff5a4d; font-size: 44px; }
  .overlay-end .panel p { margin: 10px 0 20px; color: #d8e2f0; line-height: 1.5; }
</style>
</head>

<div id="app"></div>
<script src="vendor/three.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
